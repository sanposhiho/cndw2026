<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>コメントや質問はこちらから！</title>
<style>
  :root { --ink: #0E1A3A; --ink-2: #4A5878; --paper: #F4F6FB; --line: #C9D2E8; --blue: #2F6CE5; --ng: #C6362E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100dvh; background: var(--ink); color: #fff; font: 16px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background-image: radial-gradient(circle, #1F2F5E 1.5px, transparent 2px); background-size: 28px 28px;
    padding: max(28px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
  main { max-width: 520px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 30px; line-height: 1.3; letter-spacing: .01em; }
  .lead { margin: 0 0 26px; color: #B4C2E6; font-size: 15px; }
  form { display: flex; gap: 10px; }
  input { flex: 1; min-width: 0; height: 56px; padding: 0 16px; border: 2px solid transparent; border-radius: 14px; background: #fff; color: var(--ink); font: inherit; font-size: 18px; }
  input:focus-visible { outline: none; border-color: #8FB0FF; }
  button { font: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .go { height: 56px; padding: 0 22px; border-radius: 14px; background: var(--blue); color: #fff; font-weight: 700; font-size: 17px; white-space: nowrap; }
  .go:active, .quick button:active { transform: translateY(1px); }
  button:focus-visible { outline: 3px solid #8FB0FF; outline-offset: 2px; }
  button:disabled, input:disabled { opacity: .45; cursor: default; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; min-height: 30px; margin: 8px 2px 0; font-size: 14px; color: #B4C2E6; }
  #msg { font-weight: 600; color: #fff; }
  #msg.ng { color: #FFB1AA; }
  h2 { margin: 26px 0 10px; font-size: 14px; font-weight: 600; color: #B4C2E6; }
  .quick { display: flex; flex-wrap: wrap; gap: 10px; }
  .quick button { height: 48px; padding: 0 16px; border-radius: 12px; background: rgba(143, 176, 255, .16); color: #fff; font-size: 17px; font-weight: 600; border: 1.5px solid rgba(143, 176, 255, .45); }
  .note { margin: 34px 0 0; padding-top: 16px; border-top: 1px solid rgba(180, 194, 230, .3); color: #B4C2E6; font-size: 13px; }
  .note p { margin: 0 0 6px; }
</style>
</head>
<body>
<main>
  <h1>コメントや質問はこちらから！</h1>
  <p class="lead">送ったコメントが、キーノート「Kubernetes Schedulingの最前線から見る景色」のスライドの上を流れます。</p>

  <form id="f" autocomplete="off">
    <input id="t" type="text" maxlength="40" enterkeyhint="send" placeholder="コメントを書く" aria-label="コメント" autocapitalize="off">
    <button class="go" id="go" type="submit">送る</button>
  </form>
  <div class="row"><span id="msg" role="status" aria-live="polite"></span><span id="n">0 / 40</span></div>

  <h2>ひとことで送る</h2>
  <div class="quick" id="q"></div>

  <div class="note">
    <p>コメントは会場のスクリーンと配信に映ります。40文字まで送れます。</p>
    <p>このページは、WAIWAI広場の OSS Showcase の Kubernetes クラスタで動いています。</p>
  </div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const QUICK = ['👏', '88888888', 'なるほど', 'わかりやすい', 'すごい', '草', '🎉'];
  const MSG = { paused: 'いまはコメントを受け付けていません', slow_down: '少し待ってから送ってください', busy: '混み合っています。少し待ってから送ってください',
    too_long: '40文字までにしてください', empty: 'コメントを書いてください' };
  let who = '';
  try { who = localStorage.getItem('who') || ''; if (!who) { who = crypto.randomUUID(); localStorage.setItem('who', who); } }
  catch (e) { who = String(Math.random()).slice(2) + Date.now(); }
  let paused = false, timer = null;

  const say = (text, ng) => { const m = $('msg'); m.textContent = text; m.className = ng ? 'ng' : ''; clearTimeout(timer); if (text && !ng) timer = setTimeout(() => { m.textContent = ''; }, 2500); };
  const lock = on => { paused = on; for (const e of document.querySelectorAll('input, button')) e.disabled = on; if (on) say(MSG.paused, true); else if ($('msg').textContent === MSG.paused) say(''); };

  async function post(text) {
    text = text.trim();
    if (!text) return say(MSG.empty, true);
    try {
      const r = await fetch('/api/comments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: text, c: who }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok) { say('送りました'); return true; }
      if (j.error === 'paused') lock(true); else say(MSG[j.error] || '送れませんでした。もう一度試してください', true);
    } catch (e) { say('送れませんでした。通信を確かめて、もう一度試してください', true); }
    return false;
  }

  $('f').addEventListener('submit', async e => { e.preventDefault(); const t = $('t'); if (await post(t.value)) { t.value = ''; $('n').textContent = '0 / 40'; } if (!paused) t.focus(); });
  $('t').addEventListener('input', e => { $('n').textContent = [...e.target.value].length + ' / 40'; });
  for (const q of QUICK) { const b = document.createElement('button'); b.type = 'button'; b.textContent = q; b.addEventListener('click', () => post(q)); $('q').appendChild(b); }

  // 止められているあいだは、入力欄を使えなくする
  async function watch() {
    try { const j = await (await fetch('/api/state', { cache: 'no-store' })).json(); if (!!j.paused !== paused) lock(!!j.paused); } catch (e) {}
    setTimeout(watch, 5000);
  }
  watch();
})();
</script>
</body>
</html>
