# 発表中のスライド下部に、聴衆のコメントを表示するための小さなサーバ。
# 投稿ページ（/）、投稿の受付、スライドへの受け渡し、一括停止（/admin）を持つ。状態はメモリだけで、Pod が作り直されると消える。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comments
spec:
  replicas: 1   # コメントをメモリに持つので、増やさない
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: comments
  template:
    metadata:
      labels:
        app: comments
      annotations:
        # コードが変わったら Pod を作り直すための印
        comments/code-sha256: "d2e4e54b89e0500040c43b7aef77c369d669025ee0ef68e43cbf974e511b7dd7"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: app
          image: node:22-alpine
          command: ["node", "/app/server.js"]
          env:
            - name: PORT
              value: "8080"
            # 管理用の合言葉の SHA-256。合言葉そのものは、このリポジトリには書いていない
            - name: ADMIN_SHA256
              value: "2798f0be434676464d3a05b3d62bd47c1068653349843378653916c9e5b87833"
          ports:
            - containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: comments
---
apiVersion: v1
kind: Service
metadata:
  name: comments
spec:
  selector:
    app: comments
  ports:
    - port: 80
      targetPort: 8080
